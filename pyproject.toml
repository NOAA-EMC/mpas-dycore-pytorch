[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpas-pytorch"
version = "0.1.7"
description = "A differentiable PyTorch implementation of the MPAS-Atmosphere dynamics core"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "IC Weather LLC"}, {name = "Xiaoxu Tian"}]
keywords = ["mpas", "pytorch", "atmospheric-dynamics", "weather-modeling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "torch==2.8.0",
  "netCDF4==1.7.4",
  "numpy==2.0.2",
]

[project.scripts]
mpas-pytorch = "mpas_pytorch.cli.run:main"

[project.optional-dependencies]
test = ["build>=1.3", "pytest>=7", "twine>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mpas_pytorch*"]

[tool.setuptools.package-data]
mpas_pytorch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
